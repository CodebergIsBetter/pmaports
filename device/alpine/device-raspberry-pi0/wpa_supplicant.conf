# Wi-Fi credentials. Replaced by "pmbootstrap install --wifi-ssid", or by
# dropping a wpa_supplicant.conf onto the FAT boot partition.
#
# Add a network by hand:
#   wpa_passphrase "MySSID" "MyPassphrase" >> /etc/wpa_supplicant/wpa_supplicant.conf
#   rc-service wpa_supplicant restart
country=US
ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=wheel
update_config=1
