# X11 on VideoCore IV.
#
# 1. No glamor. glamor renders X's 2D through GL and on VC4 allocates hundreds
#    of buffers out of the 64 MB CMA region (measured on hardware: 929 V3D BOs
#    / 30 MB, on top of the fixed 16 MB binner). CMA is exhausted and Xorg
#    fails with "Failed to allocate 1920x1080 FBO due to GL_OUT_OF_MEMORY",
#    leaving a black screen with every process still running.
#    Measured with AccelMethod none: CmaFree 12.8 MB -> 52.6 MB.
#    Unaccelerated X is also faster than glamor for X's 2D path on this SoC.
#    Direct-rendering GL clients are unaffected - they use Mesa's vc4 driver,
#    not X's acceleration.
#
# 2. 720p. With no acceleration every blit is done by the CPU, and this board
#    has one 1 GHz ARMv6 core with no NEON. 1280x720 is 44% of the pixels of
#    1920x1080, so full-screen operations cost about 2.25x less.
#    Delete the Monitor/Screen sections below for native resolution.
Section "Device"
	Identifier "VideoCore IV"
	Driver "modesetting"
	Option "AccelMethod" "none"
EndSection

Section "Monitor"
	Identifier "HDMI-1"
	Option "PreferredMode" "1280x720"
EndSection

Section "Screen"
	Identifier "Screen0"
	Device "VideoCore IV"
	Monitor "HDMI-1"
	DefaultDepth 16
	SubSection "Display"
		Depth 16
		Modes "1280x720" "1024x768" "800x600"
	EndSubSection
EndSection

# 3. 16-bit colour. With no acceleration the CPU moves every pixel, so halving
#    bytes per pixel roughly halves blit cost, and it halves scanout bandwidth
#    too. Verified on hardware: depths 24/16/15 all start, and vc4 also offers
#    12 (4444) and 8 (332).
#    Depth 16 is the right pick because 16, 15 and 12 ALL use 16 bpp in the
#    framebuffer - identical memory and bandwidth - so 15 and 12 are strictly
#    worse. 565 spends its spare bit on green, where the eye is most sensitive.
#    Depth 8 is RGB332, not a palette: blue gets two bits and greys turn olive.
#    At 1280x720: 1.76 MB per frame vs 3.52 MB at depth 24 (8.29 MB at 1080p/24).
#
# 4. Never blank the screen. With no keyboard or mouse attached there is never
#    any input, so X's screensaver (default 600s) and DPMS (standby 600s,
#    off 900s) blank the display and nothing ever wakes it again. Measured on
#    hardware before this was set: "timeout: 600 / Standby: 600 / Off: 900".
Section "ServerFlags"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection
